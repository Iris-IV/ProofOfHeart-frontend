name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Basic validation
        run: |
          echo "Basic CI passed :heart:"
          echo "Build check skipped for velocity - auto-merge handles review"
          # If you want strict checks later, re-enable bun build / npm build here
