name: Commitlint

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel in-progress runs for the same PR so pushes don't stack up.
concurrency:
  group: commitlint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Validate commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fall back to HEAD~1 if base.sha is unavailable (e.g. force-pushed base).
      - name: Validate commit messages
        shell: bash
        run: |
          FROM="${{ github.event.pull_request.base.sha }}"
          if [ -z "$FROM" ]; then
            echo "::warning::base.sha is empty, falling back to HEAD~1"
            FROM="HEAD~1"
          fi
          npx commitlint --from "$FROM" --to HEAD

  pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pass the PR title via env var to avoid shell injection from special chars.
      - name: Validate PR title
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx commitlint --config commitlint.config.js
