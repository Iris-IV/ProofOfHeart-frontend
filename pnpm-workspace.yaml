packages:
  - "."

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  sharp: true
  unrs-resolver: true

# Security overrides — forces patched versions of transitive deps with known CVEs.
# See package.json "_overridesRationale" for details on each entry.
overrides:
  axios: ">=1.18.0"
  follow-redirects: ">=1.16.0"
  "@swc/helpers": ">=0.5.21"
  postcss: ">=8.5.10"
  ws: ">=8.21.0"
  brace-expansion: "^2.1.2"
  elliptic: ">=6.6.1"
  fast-uri: ">=3.1.4"
  js-yaml: ">=4.2.1"
  form-data: ">=4.0.6"
  "@babel/core": ">=7.29.1"
