packages:
  - "."

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  core-js-pure: true
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - brace-expansion@1.1.17

# Security overrides — forces patched versions of transitive deps with known CVEs.
# See package.json "_overridesRationale" for details on each entry.
overrides:
  axios: ">=1.18.0"
  follow-redirects: ">=1.16.0"
  "@swc/helpers": ">=0.5.21"
  postcss: ">=8.5.18"
  ws: ">=8.21.0"
  "brace-expansion@1": "^1.1.17"
  "brace-expansion@2": "^2.1.3"
  elliptic: ">=6.6.1"
  fast-uri: ">=3.1.4"
  js-yaml: ">=4.2.1"
  form-data: ">=4.0.6"
  "@babel/core": ">=7.29.1"
  sharp: ">=0.35.0"
  next: ">=16.2.11"
