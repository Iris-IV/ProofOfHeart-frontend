allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  sharp: true
  unrs-resolver: true
# Keep in sync with the `overrides` block in package.json — CI installs with npm,
# but contributors using pnpm must resolve to the same patched versions.
overrides:
  axios: "1.18.0"
  follow-redirects: "1.16.0"
  "@swc/helpers": "0.5.21"
  postcss: "^8.5.10"
  form-data: "^4.0.6"
  js-yaml: "^4.3.0"
  "@babel/core": "^7.29.1"
  ws: "^8.21.0"
  sharp: ">=0.35.0"
  uuid: ">=11.1.1"
  "brace-expansion@1": "^1.1.17"
  "brace-expansion@2": "^2.1.3"
  "brace-expansion@3": "^3.0.5"
  "brace-expansion@5": "^5.0.8"
  "webpack-bundle-analyzer>ws": "^7.5.11"
